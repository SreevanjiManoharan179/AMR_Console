<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>AMR Console</title>
<style>
* {
  box-sizing:border-box}
html {
  color-scheme:light}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px/1.5 var(--font);
  min-width:320px}
button,input,select {
  font:inherit;
  color:inherit}
button,select,summary {
  cursor:pointer}
button,a,input,select,summary {
  touch-action:manipulation}
button {
  min-height:44px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:8px;
  padding:9px 14px;
  font-weight:650}
button:hover:not(:disabled) {
  filter:brightness(.94)}
button:disabled {
  cursor:not-allowed;
  color:var(--muted);
  background:var(--soft)}
button.primary {
  background:var(--accent);
  color:var(--onaccent);
  border-color:var(--accent)}
button.primary:disabled {
  background:var(--soft);
  color:var(--muted);
  border-color:var(--line)}
:focus-visible {
  outline:3px solid var(--focus);
  outline-offset:3px}
h1,h2,h3,p {
  margin:0}
h1 {
  font-size:30px;
  line-height:1.2;
  letter-spacing:-1px}
h2 {
  font-size:16px;
  line-height:1.35}
h3 {
  font-size:14px}
.muted,.hint {
  color:var(--muted)}
.hint {
  font-size:12px;
  line-height:1.5}
.eyebrow {
  text-transform:uppercase;
  letter-spacing:1.5px;
  font-size:10px;
  font-weight:750}
.tag {
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--line);
  border-radius:5px;
  padding:3px 8px;
  font-size:11px;
  font-weight:650;
  white-space:nowrap}
.good {
  color:var(--green)}
.dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:currentColor;
  display:inline-block;
  flex:none}
.brand {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  font-weight:750;
  letter-spacing:-.5px}
.brand svg {
  width:32px;
  height:32px;
  color:var(--accent)}
.stop {
  background:var(--red);
  border:1px solid var(--red);
  color:#fff;
  min-width:128px;
  min-height:52px;
  border-radius:8px;
  font-size:18px;
  letter-spacing:1px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px}
.stop:before {
  content:'';
  width:13px;
  height:13px;
  background:#fff;
  border-radius:2px}
.card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden}
.cardhead {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px}
.card p {
  margin-top:5px}
label {
  display:grid;
  gap:5px;
  font-size:12px;
  font-weight:650}
input,select {
  min-height:44px;
  width:100%;
  background:var(--panel);
  border:1px solid var(--inputline);
  border-radius:7px;
  padding:8px 11px;
  min-width:0}
.field {
  margin-top:12px}
.locked {
  font-size:11px;
  color:var(--muted);
  margin-top:10px;
  line-height:1.5}
.locktitle {
  font-weight:700}
.split {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px}
.methods {
  margin:9px 0 0;
  padding:0;
  list-style:none;
  font-size:11px;
  color:var(--muted)}
.methods b {
  color:var(--ink);
  font-weight:650}
.card .action {
  width:100%;
  margin-top:12px}
.mapview {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background-color:var(--mapbg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  min-height:250px;
  text-align:center;
  overflow:hidden}
.mapview .placeholder {
  padding:28px;
  position:relative}
.placeholder svg {
  width:64px;
  height:64px;
  color:var(--mapink);
  margin-bottom:12px}
.placeholder h2 {
  font-size:17px}
.placeholder p {
  font-size:12px;
  max-width:290px;
  margin:7px auto 0;
  color:var(--muted)}
.mapcorner {
  position:absolute;
  top:16px;
  left:18px;
  text-align:left}
.mapfoot {
  display:flex;
  justify-content:space-between;
  gap:12px;
  border-top:1px solid var(--line);
  padding:11px 16px;
  font-size:11px;
  color:var(--muted);
  background:var(--panel)}
.pad {
  display:grid;
  grid-template-columns:repeat(3,52px);
  grid-template-rows:repeat(3,48px);
  gap:6px;
  justify-content:center;
  margin:16px auto}
.pad button {
  font-size:23px;
  padding:0;
  background:var(--soft);
  border-color:var(--inputline);
  border-radius:9px}
.pad .zero {
  font-size:11px;
  color:var(--red);
  border-color:var(--red);
  background:var(--panel)}
kbd {
  font:11px var(--font);
  padding:2px 5px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--soft)}
.speed {
  display:flex;
  justify-content:space-between;
  border-top:1px solid var(--line);
  padding-top:10px;
  font-size:12px}
.speed b {
  font-variant-numeric:tabular-nums}
.target small {
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:400}
.statusbar {
  display:flex;
  align-items:center;
  gap:24px;
  font-size:12px}
.statusbar b {
  font-weight:650}
.system {
  font-size:12px;
  color:var(--muted)}
.system summary {
  min-height:44px;
  display:list-item;
  padding:12px 0;
  font-weight:600;
  color:var(--ink)}
.system dl {
  display:grid;
  grid-template-columns:160px 1fr;
  gap:6px 12px;
  margin:8px 0 18px}
.system dt,.system dd {
  margin:0;
  overflow-wrap:anywhere}
.system dd {
  font-family:ui-monospace,monospace}
.samplebar {
  font-size:11px;
  color:var(--muted)}
.notice {
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--panel);
  padding:14px 20px;
  border-radius:9px;
  box-shadow:0 5px 30px #0003;
  z-index:10;
  max-width:calc(100% - 30px);
  font-size:13px}
.notice:empty {
  display:none}
.skip {
  position:fixed;
  top:-100px;
  left:20px;
  background:var(--panel);
  padding:12px;
  z-index:20;
  color:var(--ink)}
.skip:focus {
  top:10px}
nav button[aria-current=page] {
  color:var(--accent);
  background:var(--selected)}
nav button {
  border:0;
  text-align:left;
  background:transparent;
  color:var(--muted);
  font-weight:550}
.theme {
  font-size:12px;
  white-space:nowrap}
.connection {
  display:flex;
  gap:7px;
  align-items:center;
  color:var(--green)}
.flex {
  display:flex;
  align-items:center;
  gap:12px}
.wide {
  width:100%}
footer {
  padding:0 0 16px}
.manualnote {
  font-size:11px;
  text-align:center;
  color:var(--muted)}
@media(prefers-reduced-motion:reduce) {
  * {
  scroll-behavior:auto!important}
}
@media(max-width:700px) {
  .split {
  grid-template-columns:1fr}
.statusbar {
  flex-wrap:wrap;
  gap:8px 16px}
.target {
  display:none}
}


:root {
  --bg:#f3f6f9;
  --panel:#fff;
  --soft:#f1f4f8;
  --ink:#152b3e;
  --muted:#526474;
  --line:#dce3e9;
  --inputline:#aab9c6;
  --accent:#076a68;
  --onaccent:#fff;
  --green:#096b50;
  --red:#bd2937;
  --focus:#146be0;
  --selected:#e5f2ef;
  --mapbg:#f6f9fa;
  --grid:#e7eef0;
  --mapink:#6d8b96;
  --font:system-ui,-apple-system,'Segoe UI',sans-serif}

html[data-theme=dark] {
  color-scheme:dark;
  --bg:#101b25;
  --panel:#182733;
  --soft:#20313d;

  --onaccent:#092925;
  --green:#8bddd0;
  --red:#bc293b;
  --focus:#80baff;
  --selected:#233f40;
  --mapbg:#14232c;
  --grid:#22333c;
  --mapink:#8cabb8}

.shell {
  display:grid;

.board {

@media(max-width:1150px) {

  padding-right:20px}
.board {
  grid-template-columns:minmax(0,1fr) 268px;
  gap:14px}

  grid-template-columns:1fr}

  padding:11px 20px;

@media(max-width:760px) {

  grid-template-columns:1fr}
.sidebar {

.sidebar nav {
  display:flex;

.sidebar nav span,.sidebar .bottom {
  display:none}
.board {
  grid-template-columns:1fr}
.toptools {
  gap:10px}
.topbar {
  position:sticky;
  top:0;
  z-index:5;

.connection {
  font-size:11px}
.launchrow {
  grid-template-columns:1fr 1fr}

  grid-template-columns:1fr 1fr}

.title .tag {
  display:none}

@media(max-width:520px) {
  .rail,.launchrow {
  grid-template-columns:1fr}
}

    stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
    const context=new (window.AudioContext || window.webkitAudioContext)();
    const source=context.createMediaStreamSource(stream),processor=context.createScriptProcessor(4096,1,1),chunks=[];
    processor.onaudioprocess=event=>{
      const data=event.inputBuffer.getChannelData(0);chunks.push(new Float32Array(data));
      const r=S.officeRec;if(!r || !r.auto || r.ending)return;
      // Stop by itself: about a second of quiet after speech, or 7 s in which nobody spoke.
      let sum=0;for(let i=0;i<data.length;i++)sum+=data[i]*data[i];
      const level=Math.sqrt(sum/data.length),now=performance.now();
      if(now-r.started<400){r.floor=Math.max(r.floor,level);return;}
      if(level>Math.max(0.02,r.floor*3)){r.spoke=true;r.quiet=null;}
      else if(r.spoke){r.quiet=r.quiet ?? now;if(now-r.quiet>1100){r.ending=true;setTimeout(officeMicStop,0);}}
      else if(now-r.started>7000){r.ending=true;r.nothing=true;setTimeout(officeMicStop,0);}
    };
    source.connect(processor);processor.connect(context.destination);
    S.officeRec={target,stream,context,source,processor,chunks,rate:context.sampleRate,timer:setTimeout(officeMicStop,15000),input_id:target==='reply'?S.office?.awaiting?.input_id:null,auto,started:performance.now(),floor:0,spoke:false,quiet:null};
    updateOfficeButtons();showNotice(auto?'Listening for the reply…':'Listening… press Stop listening when you finish (15 s at most).');
  }catch(error){
    if(stream)stream.getTracks().forEach(track=>track.stop());
    showNotice('The microphone could not start: '+(error.message || error));
  }
}
async function officeMicStop(){
  const r=S.officeRec;if(!r)return;S.officeRec=null;clearTimeout(r.timer);
  try{r.processor.disconnect();r.source.disconnect();}catch(_){}
  r.stream.getTracks().forEach(track=>track.stop());try{await r.context.close();}catch(_){}
  if(r.target==='reply' && S.office?.awaiting?.input_id!==r.input_id){updateOfficeButtons();showNotice('That question was already answered or has expired; the recording was not used.');return;}
  if(r.auto && r.nothing){updateOfficeButtons();showNotice('I did not hear a reply. Press Speak, use a button, or type it.');return;}
  const wav=officeWav(r.chunks,r.rate);
  if(wav.size<44+16000){updateOfficeButtons();showNotice('That was too short. Press Speak and talk for at least a second.');return;}
  // "Automatic" means the speaker's own language: the requester's, or the language the robot is using at the stop.
  const ask=S.office?.awaiting,language=r.target==='request'?S.officeForm.language:'auto';
  const said=ask?[...(S.office?.timeline || [])].reverse().find(e=>e.kind==='robot' && e.job_id===ask.job_id):null;
  const hint=r.target==='request'?S.office?.context?.requesters?.find(p=>p.id===S.officeForm.requester)?.language:said?.language;
  S.officeTranscribing=true;updateOfficeButtons();
  try{
    const result=await S.api.officeSpeech(wav,language,hint);
    const words=String(result.text || '').trim();
    if(r.target==='request'){
      S.officeForm.text=words;if($('officeText')){$('officeText').value=words;$('officeText').focus();}
      // The language box stays on the person's choice: "Automatic" reads the language from the words each time.
    }else if($('officeReplyText') && S.office?.awaiting?.input_id===ask?.input_id){
      $('officeReplyText').value=words;$('officeReplyText').focus();
      // Hands-free: clear words go straight to the robot; it asks again by itself if they are not an answer.
      if(r.auto && words && !result.distorted){showNotice('Heard: “'+words+'”');S.officeTranscribing=false;await officeReply(words);return;}
    }
    showNotice(words && result.distorted?`The microphone signal is overloaded (${Math.round((result.clipped || 0)*100)} % clipped), so these words may be wrong. Lower the input volume in Settings → Sound → Input, or use another microphone.`:words?'Check the words, then send.':result.silent?`The microphone sent only silence (loudest sound ${result.peak_db} dB). It may be muted: check Settings → Sound → Input, or choose another microphone from the microphone icon in the address bar.`:`No speech was recognised (loudest sound ${result.peak_db ?? '?'} dB). Speak closer to the microphone and try again.`);
  }catch(error){fail(error,'Speech:');}
  finally{S.officeTranscribing=false;updateOfficeButtons();}
}
function officeWav(chunks,rate){
  let length=0;for(const c of chunks)length+=c.length;
  const input=new Float32Array(length);let at=0;for(const c of chunks){input.set(c,at);at+=c.length;}
  const ratio=rate/16000,count=Math.floor(input.length/ratio),pcm=new Int16Array(count);
  for(let i=0;i<count;i++){
    const start=Math.floor(i*ratio),end=Math.max(start+1,Math.min(input.length,Math.floor((i+1)*ratio)));let sum=0;
    for(let j=start;j<end;j++)sum+=input[j];
    const v=Math.max(-1,Math.min(1,sum/(end-start)));pcm[i]=v<0?v*32768:v*32767;
  }
  const buffer=new ArrayBuffer(44+pcm.length*2),view=new DataView(buffer);
  const text=(offset,value)=>{for(let i=0;i<value.length;i++)view.setUint8(offset+i,value.charCodeAt(i));};
  text(0,'RIFF');view.setUint32(4,36+pcm.length*2,true);text(8,'WAVE');text(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
  view.setUint32(24,16000,true);view.setUint32(28,32000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);text(36,'data');view.setUint32(40,pcm.length*2,true);
  new Int16Array(buffer,44).set(pcm);return new Blob([buffer],{type:'audio/wav'});
}

function acceptStatus(status){
  if(!status || !['idle','starting','running','stopping','error'].includes(status.state))return;
  const before=S.status,keyBefore=sessionKey();
  S.status=status;
  const keyAfter=sessionKey();
  if(keyBefore && keyAfter!==keyBefore){S.conversationStarted=false;}
  if(before && before.state!==status.state)addLog('Session state: '+status.state,'state');
  const key=JSON.stringify([status.state,status.session?.kind,status.session?.teleop,status.session?.run_id,status.session?.action_id,sessionWorld()]);
  if(S.review&&!S.review.running && S.viewKey && key!==S.viewKey)invalidateReview('The session changed. Refresh the backend preview before running.');
  const needsRender=key!==S.viewKey;if(needsRender)S.cardPreviews={};S.viewKey=key;
  renderStrip();renderSystem();
  if(needsRender)renderMain();else{updateAvailability();for(const action of actionsFor(S.tab))scheduleCardPreview(action);}
  if(!driveAllowed())releaseMotion();
  // Office requests depend on the session (robot mode needs navigation on the office map).
  if(needsRender && S.office)officeLoad();
}
function onEvent(event){
  if(event.type==='state'){
    const status=event.status || (typeof event.state==='object'?event.state:null) || event.data || (typeof event.state==='string'?event:null);
    acceptStatus(status);
  }else if(event.type==='log'||event.type==='alarm'){
    const text=event.text ?? event.reason ?? '';
    addLog(text,event.type==='alarm'?'alarm':event.level || 'info',event.ts);
    if(event.type==='alarm'){S.error=String(text);renderBanners();}
    // Only alarms join the conversation; replies come from the request's own response.
    if(event.type==='alarm' && S.conversationStarted && S.status?.session?.kind==='navigation' && S.conversationRun===sessionKey()){
      S.messages.push({who:'session',text:String(text),time:Date.now()});if(S.messages.length>200)S.messages.splice(0,S.messages.length-200);renderConversation();
    }
  }else if(event.type==='office'){
    acceptOffice(event.office);
  }
}
async function refreshStatus(){
  if(!S.api || S.refreshPending)return;
  S.refreshPending=true;
  try{const status=await S.api.status();connectionGood();acceptStatus(status);}
  catch(error){connectionFailed(error);}
  finally{S.refreshPending=false;}
}
async function refreshActions(){
  if(!S.api||S.actionsPending)return;
  S.actionsPending=true;
  try{
    const result=await S.api.actions(),next=Array.isArray(result.actions)?result.actions:[];
    if(JSON.stringify(next)!==JSON.stringify(S.actions)){
      S.actions=next;learnWorldLabels(next);S.cardPreviews={};if(S.review&&!S.review.running)invalidateReview('The backend action registry changed. Refresh the preview.');
      renderMain();renderStrip();
    }
  }catch(error){if(error.status===403)connectionFailed(error);else addLog(errorText(error),'warn');}
  finally{S.actionsPending=false;}
}
$('theme').addEventListener('click',()=>{
  const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';
  $('theme').textContent=dark?'Light theme':'Dark theme';$('theme').setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');
});
$('stop').addEventListener('click',stopSession);$('reviewStop').addEventListener('click',stopSession);
$('cancelReview').addEventListener('click',closeReview);$('refreshReview').addEventListener('click',fetchReview);$('run').addEventListener('click',runReviewed);
$('review').addEventListener('cancel',event=>{event.preventDefault();closeReview();});
window.addEventListener('focus',()=>{if(S.api){refreshStatus();refreshActions();}});
async function start(){
  // Remove the token before any request or rendering. Keep it only in the API closure.
  const url=new URL(location.href);let token=url.searchParams.get('token');
  if(url.searchParams.has('token')){
    url.searchParams.delete('token');
    try{history.replaceState(null,'',url.pathname+url.search+url.hash);}catch(_){
      // If sanitisation fails, do not connect with the exposed credential.
      token=null;S.initialError='The access link could not be cleared from the address bar. Reopen the console from its launcher.';
    }
  }
  S.preview=location.protocol==='file:' || url.searchParams.get('preview')==='1';
  renderNavigation();renderStrip();renderMain();renderSystem();
  if(S.preview){S.api=previewApi();S.streamHealthy=true;}
  else if(token){S.api=realApi(token);}
  else{
    S.initialError=S.initialError || 'Access token missing. Reopen the console using the link provided by its launcher. Preview is available only when explicitly requested.';
    setConnection('lost',S.initialError);renderStrip();return;
  }
  token=null;
  S.api.events(onEvent,streamOpen,streamError);
  await refreshStatus();await refreshActions();renderMain();renderSystem();renderStrip();
  addLog(S.preview?'Preview mode: sample data only. No computer or robot is controlled.':'Console session connected.');
  setInterval(refreshStatus,3000);setInterval(refreshActions,15000);
  setInterval(()=>{if(S.tab==='office' && S.connection==='connected')officeLoad();},10000);
}
start().catch(error=>{S.initialError=errorText(error);setConnection('lost',S.initialError);renderBanners();});

</script>
