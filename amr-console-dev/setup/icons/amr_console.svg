<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>AMR Console</title>
  <defs>
    <linearGradient id="amrConsoleBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c8f8a"/>
      <stop offset="1" stop-color="#04504e"/>
    </linearGradient>
    <clipPath id="amrConsoleTile"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#amrConsoleBg)"/>
  <!-- a floor-plan grid: the robot works on a map -->
  <g clip-path="url(#amrConsoleTile)" stroke="#ffffff" stroke-opacity=".09" stroke-width="2">
    <path d="M40 8V248M72 8V248M104 8V248M136 8V248M168 8V248M200 8V248M232 8V248"/>
    <path d="M8 40H248M8 72H248M8 104H248M8 136H248M8 168H248M8 200H248M8 232H248"/>
  </g>
  <!-- route to the next stop -->
  <path d="M186 110 C202 100 206 88 201 76" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 12"/>
  <path d="M200 26c-12.7 0-23 10-23 22.6 0 16.4 23 37.4 23 37.4s23-21 23-37.4C223 36 212.7 26 200 26z" fill="#ffffff"/>
  <circle cx="200" cy="48.5" r="8.5" fill="#0a7a76"/>
  <!-- shadow -->
  <ellipse cx="128" cy="204" rx="80" ry="7" fill="#000" fill-opacity=".22"/>
  <!-- the stack on the tray: a box and two files -->
  <rect x="78" y="70" width="50" height="38" rx="5" fill="#f6b73c"/>
  <path d="M103 70v38" stroke="#c98a12" stroke-width="5"/>
  <rect x="134" y="94" width="44" height="7" rx="3" fill="#ffffff"/>
  <rect x="131" y="102" width="50" height="7" rx="3" fill="#d7efec"/>
  <!-- tray -->
  <rect x="62" y="108" width="132" height="10" rx="5" fill="#e3f4f1"/>
  <!-- body -->
  <rect x="68" y="118" width="120" height="62" rx="20" fill="#ffffff"/>
  <!-- face: a friendly display -->
  <rect x="84" y="132" width="64" height="28" rx="14" fill="#0b3b3a"/>
  <circle cx="103" cy="146" r="5.5" fill="#8bddd0"/>
  <circle cx="129" cy="146" r="5.5" fill="#8bddd0"/>
  <!-- front light -->
  <rect x="166" y="138" width="12" height="16" rx="5" fill="#f6b73c"/>
  <!-- wheels -->
  <circle cx="94" cy="184" r="17" fill="#0b3b3a"/>
  <circle cx="94" cy="184" r="6.5" fill="#8bddd0"/>
  <circle cx="162" cy="184" r="17" fill="#0b3b3a"/>
  <circle cx="162" cy="184" r="6.5" fill="#8bddd0"/>
</svg>
