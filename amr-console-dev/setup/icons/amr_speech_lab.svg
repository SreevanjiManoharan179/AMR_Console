<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>AMR Speech Lab</title>
  <defs>
    <linearGradient id="amrLabBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b52e8"/>
      <stop offset="1" stop-color="#2b2780"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#amrLabBg)"/>
  <!-- sound reaching the microphone -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="9">
    <path d="M70 52a68 68 0 0 0 0 64" stroke-opacity=".9"/>
    <path d="M186 52a68 68 0 0 1 0 64" stroke-opacity=".9"/>
    <path d="M50 38a92 92 0 0 0 0 92" stroke-opacity=".5"/>
    <path d="M206 38a92 92 0 0 1 0 92" stroke-opacity=".5"/>
  </g>
  <!-- microphone -->
  <rect x="104" y="34" width="48" height="88" rx="24" fill="#ffffff"/>
  <path d="M112 62h32M112 76h32M112 90h32" stroke="#c7cbfb" stroke-width="5" stroke-linecap="round"/>
  <path d="M86 92v8a42 42 0 0 0 84 0v-8" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M128 142v18M106 162h44" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <!-- the level meter: what the lab shows while someone speaks -->
  <g fill="#f6b73c">
    <rect x="62" y="200" width="12" height="14" rx="5"/>
    <rect x="82" y="190" width="12" height="24" rx="5"/>
    <rect x="102" y="180" width="12" height="34" rx="5"/>
    <rect x="122" y="186" width="12" height="28" rx="5"/>
    <rect x="142" y="178" width="12" height="36" rx="5"/>
    <rect x="162" y="192" width="12" height="22" rx="5"/>
    <rect x="182" y="202" width="12" height="12" rx="5"/>
  </g>
</svg>
