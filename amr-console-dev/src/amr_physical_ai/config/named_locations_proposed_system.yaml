# proposed_system named places (18 Oct 2026). The owner confirms them with approval_status below.
# Virtual demo goals in the generated office world (worlds/proposed_system_layout.yaml), not detected
# rooms: the dock plus one goal in every room, each in front of the room's main furniture and
# facing it (yaw in radians, map frame).
# Approval is two edits, both made by the owner:
#   1. approval_status: confirmed in this file
#   2. proposed_system_places: true in tools/amr_console/approvals.yaml
# Only the word "office" is shared, on purpose: "go to the office" fits the open office and the
# team office, so it gets the question "Which one: the open office or the team office?".
# No other word is shared between places, and no spelling of one place is close to another's
# (token scorer). open_office has no "desk" alias, because "front desk" means reception.
