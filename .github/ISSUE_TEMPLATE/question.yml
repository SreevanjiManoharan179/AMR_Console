name: Question or suggestion
description: Ask about the design, the results or how to use something, or suggest an improvement.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question or suggestion
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you are trying to do, and what you have already read or tried.
