version: 2
updates:
  # GitHub Actions used by CI: proposals for new versions, monthly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Python test requirements are deliberately broad ranges ("supported major versions"), so no
  # version-update pull requests (limit 0). CI installs the newest allowed versions on every run,
  # and security updates, if turned on in the repository settings, are not affected by this limit.
  - package-ecosystem: pip
    directory: /amr-console-dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /amr-language
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
